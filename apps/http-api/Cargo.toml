[package]
name = "ekyc-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
ekyc-domain = { path = "../../crates/domain" }
ekyc-postgres = { path = "../../adapters/postgres" }
ekyc-restate-ingress = { path = "../../adapters/restate-ingress" }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls","postgres","macros","migrate"] }

[features]
postgres-tests = []
