[package]
name = "ekyc-http-transport"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ekyc-ports = { path = "../ports" }
httpdate = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
